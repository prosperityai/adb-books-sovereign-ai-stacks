[project]
name = "sovereign-rag"
version = "1.0.0"
description = "Tenant-isolated, ACL-enforcing RAG service (Sovereign AI Stacks, Chapter 8)"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.146.0",
  "uvicorn==0.54.0",
  "qdrant-client==1.19.1",
  "pyjwt[crypto]==2.15.1",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
# PDF/DOCX conversion for the ingestion job. Heavy (pulls PyTorch), so the
# API image does not need it.
ingest = ["docling==2.140.0"]
test = ["pytest==9.1.1"]

[project.scripts]
rag-ingest = "rag.ingest:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
