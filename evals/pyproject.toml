# Evaluation and acceptance harness. Book: Sovereign AI Stacks, Chapter 11
# Lint config comes from the repository-root pyproject.toml.
[project]
name = "sovereign-evals"
version = "1.0.0"
description = "Per-language evaluation, red-team suite and acceptance gates (Sovereign AI Stacks, Chapter 11)"
requires-python = ">=3.13"
dependencies = [
  "httpx==0.28.1",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["evalkit"]
py-modules = ["harness"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
