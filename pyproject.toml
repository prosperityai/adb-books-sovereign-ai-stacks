# Shared tooling configuration for the companion repository.
[project]
name = "sovereign-ai-stacks-companion"
version = "1.0.0"
description = "Companion code for the book Sovereign AI Stacks"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ISC", "EXE"]
ignore = ["S101"]  # assert is the point of a test file

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]
"**/test_*.py" = ["S"]

[tool.pytest.ini_options]
addopts = "-q"
