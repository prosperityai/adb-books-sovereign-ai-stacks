# Test resources for `kyverno test platform/policies/tests`
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: good-gateway-egress, namespace: chat-ui}
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: ai-gateway}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: bad-world, namespace: rag}
spec:
  endpointSelector: {}
  egress:
    - toEntities: [world]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: bad-fqdn-in-specs, namespace: rag}
specs:
  - endpointSelector: {}
    egress:
      - toFQDNs:
          - matchName: api.openai.com
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata: {name: bad-cidr}
spec:
  endpointSelector: {}
  egress:
    - toCIDRSet:
        - cidr: 0.0.0.0/0
---
apiVersion: v1
kind: Service
metadata: {name: good-clusterip, namespace: inference}
spec:
  selector: {app: x}
  ports: [{port: 8000}]
---
apiVersion: v1
kind: Service
metadata: {name: bad-nodeport, namespace: inference}
spec:
  type: NodePort
  selector: {app: x}
  ports: [{port: 8000}]
---
apiVersion: v1
kind: Pod
metadata: {name: good-limits, namespace: rag}
spec:
  containers:
    - name: c
      image: harbor.enclave.internal/apps/rag-api:1.0.0
      resources:
        requests: {memory: 256Mi}
        limits: {memory: 512Mi}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-no-limits, namespace: rag}
spec:
  containers:
    - name: c
      image: harbor.enclave.internal/apps/rag-api:1.0.0
