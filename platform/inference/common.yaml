# Shared objects for every model server in the inference namespace.
# Book: Sovereign AI Stacks, Chapter 5
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm
# vLLM never talks to the Kubernetes API; don't give it a token to steal.
automountServiceAccountToken: false
---
# Only the AI gateway (and Prometheus, for /metrics) may reach model servers.
# Users, the chat UI and the RAG service all go through the gateway, which
# authenticates, meters and audits every request (Chapter 6).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: model-servers-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: model-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
