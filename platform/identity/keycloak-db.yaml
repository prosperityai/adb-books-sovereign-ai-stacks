# Keycloak's database. Book: Sovereign AI Stacks, Chapter 7
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: identity
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  postgresql:
    synchronous:
      method: any
      number: 1
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  storage:
    storageClass: ceph-block
    size: 10Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 2Gi}
