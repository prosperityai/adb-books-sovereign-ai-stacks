# =============================================================================
# langfuse-retention.yaml — nightly deletion of traces older than 30 days
# Book: Sovereign AI Stacks, Chapter 9
#
# The open-source Langfuse build has no retention setting (it is an
# Enterprise Edition feature when self-hosted). Traces hold full prompts and
# responses, so they get the same 30-day window as Loki. The script ships as
# a ConfigMap generated by ../kustomization.yaml; the image is upstream Python.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: langfuse-retention
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: langfuse-retention
  namespace: monitoring
spec:
  schedule: "17 2 * * *"          # 02:17 daily, outside office hours
  timeZone: Africa/Dar_es_Salaam
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: langfuse-retention
        spec:
          serviceAccountName: langfuse-retention
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              image: docker.io/library/python:3.13.16-slim
              command: ["python3", "/scripts/langfuse_retention.py"]
              args:
                - --host=http://langfuse-web.monitoring.svc:3000
                - --days=30
              env:
                - name: LANGFUSE_PUBLIC_KEY
                  valueFrom: {secretKeyRef: {name: langfuse-init, key: public-key}}
                - name: LANGFUSE_SECRET_KEY
                  valueFrom: {secretKeyRef: {name: langfuse-init, key: secret-key}}
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - {name: script, mountPath: /scripts, readOnly: true}
          volumes:
            - name: script
              configMap:
                name: langfuse-retention-script
