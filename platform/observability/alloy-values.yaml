# =============================================================================
# Grafana Alloy v1.20.1 (chart alloy 1.13.1) values — release "alloy",
# namespace monitoring. Ships every container's stdout/stderr to Loki.
# Book: Sovereign AI Stacks, Chapter 9
#
# Alloy replaces Promtail, which reached end of life in 2026. One DaemonSet
# pod per node tails /var/log/pods, the path Talos's containerd writes to.
# =============================================================================
alloy:
  # Alloy reports anonymous usage to stats.grafana.org unless told not to.
  enableReporting: false
  mounts:
    varlog: true
  # Runs as the image's root user: Talos writes /var/log/pods as root, 0640.
  # The root filesystem stays writable for the positions file in storagePath.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
  configMap:
    content: |
      // Pods scheduled on this node only (HOSTNAME is the node name).
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        stage.cri {}
        // Pseudonymise e-mail addresses before they are stored. The gateway
        // and chat UI log the end user's address; the audit sink (Ch 10) is
        // the only place allowed to keep it.
        stage.replace {
          expression = "([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,})"
          replace    = "<email>"
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
        external_labels = {
          cluster = "enclave-prod",
        }
      }

controller:
  type: daemonset
  # Every node, including GPU workers and the control plane.
  tolerations:
    - operator: Exists

# Prometheus scrapes Alloy's own metrics (dropped lines, push errors).
serviceMonitor:
  enabled: true

configReloader:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 64Mi}
