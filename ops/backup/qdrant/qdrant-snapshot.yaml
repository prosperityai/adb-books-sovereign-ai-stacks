# =============================================================================
# qdrant-snapshot.yaml — snapshot every collection on every Qdrant node, ship
# each snapshot to the off-cluster appliance, then delete it from the node
# Book: Sovereign AI Stacks, Chapter 12
# Qdrant 1.19.2 (release "qdrant", 3 nodes)   Image: python:3.13.16-slim-trixie
#
# Secrets (create before the first run, see Chapter 12):
#   qdrant-api-key       key "api-key"           (Chapter 8)
#   qdrant-backup-s3     AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY: a key that
#                        can write only to the "qdrant" bucket on the appliance
#   backup-appliance-ca  key "ca.crt": the enclave CA that signed
#                        backup.enclave.internal
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qdrant-snapshot
  labels:
    app.kubernetes.io/name: qdrant-snapshot
    app.kubernetes.io/component: backup
spec:
  # 22:30 UTC = 01:30 in Dar es Salaam and Nairobi (UTC+3), 02:30 in Dubai.
  schedule: "30 22 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant-snapshot
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 10800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qdrant-snapshot
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: snapshot
              image: docker.io/library/python:3.13.16-slim-trixie
              command: ["python3", "/scripts/qdrant_snapshot.py", "backup"]
              env:
                # One URL per StatefulSet pod, in pod order: a collection
                # snapshot only holds the shards on the node that took it.
                - name: QDRANT_NODES
                  value: >-
                    http://qdrant-0.qdrant-headless.rag.svc:6333,http://qdrant-1.qdrant-headless.rag.svc:6333,http://qdrant-2.qdrant-headless.rag.svc:6333
                - name: QDRANT_API_KEY
                  valueFrom: {secretKeyRef: {name: qdrant-api-key, key: api-key}}
                - {name: S3_ENDPOINT, value: "https://backup.enclave.internal"}
                - {name: S3_BUCKET, value: qdrant}
                - {name: S3_PREFIX, value: sovereign-ai}
                - {name: S3_CA_FILE, value: /ca/ca.crt}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: qdrant-backup-s3, key: AWS_ACCESS_KEY_ID}}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: qdrant-backup-s3, key: AWS_SECRET_ACCESS_KEY}}
                - {name: WORKDIR, value: /work}
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 500m, memory: 256Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - {name: script, mountPath: /scripts, readOnly: true}
                - {name: ca, mountPath: /ca, readOnly: true}
                - {name: work, mountPath: /work}
          volumes:
            - name: script
              configMap: {name: qdrant-snapshot-script}
            - name: ca
              secret: {secretName: backup-appliance-ca}
            # Holds one snapshot at a time; size it to your largest
            # collection's per-node share.
            - name: work
              emptyDir: {sizeLimit: 40Gi}
---
# Adds to Chapter 8's qdrant-ingress (Cilium policies are additive): the
# snapshot job may call the REST API on every node. Egress to the appliance
# (10.20.0.40:443) is already allowed by the enclave baseline.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qdrant-snapshot-ingress
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: qdrant}
  ingress:
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/name: qdrant-snapshot}
      toPorts:
        - ports:
            - {port: "6333", protocol: TCP}
