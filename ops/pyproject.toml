# Day-2 operations tooling (Sovereign AI Stacks, Chapter 12).
# canary.py overlay needs PyYAML; everything else is standard library.
# Run the tests from the repository root:  python3 -m pytest ops
[project]
name = "sovereign-ops"
version = "1.0.0"
description = "Upgrade, backup and DR tooling for the Sovereign AI Stacks platform"
requires-python = ">=3.13"
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

# Scripts and manifests, not an importable package: install the dependencies only.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
