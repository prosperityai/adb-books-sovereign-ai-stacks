# =============================================================================
# zarf.yaml — the complete platform, as one package that crosses the air gap
#
# Book: Sovereign AI Stacks, Chapter 3 (charts and manifests are added by
#       Chapters 4-12; the images lists are generated, see below)
# Zarf: v0.88.0
#
# Workflow (connected side):
#   zarf dev find-images airgap/ --update   # render every chart, refresh images
#   zarf package create airgap/ --confirm -o transfer/ -m 3900 \
#        --signing-key cosign.key --signing-key-pass "$COSIGN_PASSWORD"
#
# The images lists below are written by `zarf dev find-images --update`.
# Never edit them by hand: change a chart version or values file, then re-run.
# =============================================================================
kind: ZarfPackageConfig
metadata:
  name: sovereign-platform
  version: 1.0.0
  description: Sovereign AI Stacks reference platform (Kubernetes 1.37, vLLM 0.32)
  architecture: amd64

components:
  # --- Chapter 4: networking, GPUs, storage ---------------------------------
  - name: cluster-core
    required: true
    manifests:
      - name: cluster-baseline
        files:
          - ../platform/base/namespaces.yaml
          - ../platform/gpu/runtimeclass.yaml
          - ../platform/cilium/enclave-egress-baseline.yaml
          - ../platform/base/egress-test-pod.yaml
          - ../platform/cilium/lb-pool.yaml
    charts:
      - name: cilium
        url: https://helm.cilium.io/
        version: 1.20.3
        namespace: kube-system
        valuesFiles:
          - ../platform/cilium/values.yaml
      - name: nvidia-device-plugin
        url: https://nvidia.github.io/k8s-device-plugin
        version: 0.20.1
        namespace: gpu
        valuesFiles:
          - ../platform/gpu/device-plugin-values.yaml
      - name: rook-ceph
        url: https://charts.rook.io/release
        version: v1.21.0
        namespace: rook-ceph
        valuesFiles:
          - ../platform/storage/rook-ceph-values.yaml
      - name: ceph-csi-drivers
        url: https://ceph.github.io/ceph-csi-operator
        version: 1.1.0
        namespace: rook-ceph
        valuesFiles:
          - ../platform/storage/ceph-csi-drivers-values.yaml
      - name: rook-ceph-cluster
        url: https://charts.rook.io/release
        version: v1.21.0
        namespace: rook-ceph
        valuesFiles:
          - ../platform/storage/rook-ceph-cluster-values.yaml

  # --- Chapters 5 and 8: inference and embeddings ---------------------------
  - name: inference
    required: true
    manifests:
      - name: inference
        namespace: inference
        kustomizations:
          - ../platform/inference
      - name: embeddings
        namespace: rag
        files:
          - ../platform/rag/tei-bge-m3.yaml
          - ../platform/rag/tei-reranker.yaml

  # --- Chapter 6: gateway, its database and the chat UI ---------------------
  - name: gateway
    required: true
    charts:
      - name: cloudnative-pg
        url: https://cloudnative-pg.github.io/charts
        version: 0.29.1
        namespace: cnpg-system
      - name: litellm-helm
        url: oci://ghcr.io/berriai/litellm-helm
        version: 1.106.0
        namespace: ai-gateway
        valuesFiles:
          - ../platform/gateway/litellm-values.yaml
          - ../platform/observability/litellm-values.observability.yaml
      - name: open-webui
        url: https://helm.openwebui.com
        version: 17.0.0
        namespace: chat-ui
        valuesFiles:
          - ../platform/chat-ui/open-webui-values.yaml
    manifests:
      - name: gateway-db
        namespace: ai-gateway
        files:
          - ../platform/gateway/postgres-cluster.yaml
          - ../platform/gateway/gateway-ingress-policy.yaml
          - ../platform/chat-ui/ingress-and-policy.yaml

  # --- Chapter 7: identity and policy ---------------------------------------
  - name: identity
    required: true
    manifests:
      - name: keycloak-operator
        namespace: identity
        files:
          - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.8.1/kubernetes/keycloaks.k8s.keycloak.org-v1.yml
          - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.8.1/kubernetes/keycloakrealmimports.k8s.keycloak.org-v1.yml
          - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.8.1/kubernetes/kubernetes.yml
      - name: keycloak
        namespace: identity
        files:
          - ../platform/identity/keycloak-db.yaml
          - ../platform/identity/keycloak.yaml
          - ../platform/identity/realm-government.yaml
      - name: platform-policies
        files:
          - ../platform/policies/deny-world-egress.yaml
          - ../platform/policies/no-external-services.yaml
          - ../platform/policies/require-limits.yaml
    charts:
      - name: kyverno
        url: https://kyverno.github.io/kyverno/
        version: 3.9.1
        namespace: kyverno
        valuesFiles:
          - ../platform/policies/kyverno-values.yaml

  # --- Chapter 8: vector database and RAG service ---------------------------
  - name: rag
    required: true
    charts:
      - name: qdrant
        url: https://qdrant.github.io/qdrant-helm
        version: 1.19.2
        namespace: rag
        valuesFiles:
          - ../platform/rag/qdrant-values.yaml
    manifests:
      - name: rag-api
        namespace: rag
        files:
          - ../platform/rag/rag-api.yaml
          - ../platform/rag/ingest-job.yaml

  # --- Chapter 9: observability ---------------------------------------------
  # Three components because of ordering: the Prometheus CRDs must exist
  # before anything ships a ServiceMonitor (the DCGM chart has no capability
  # check), and Langfuse needs its database and buckets before it starts.
  # Hubble's ServiceMonitor is switched on by the Chapter 9 Cilium upgrade.
  - name: observability-core
    required: true
    charts:
      - name: kube-prometheus-stack
        url: https://prometheus-community.github.io/helm-charts
        version: 92.10.1
        namespace: monitoring
        valuesFiles:
          - ../platform/observability/kube-prometheus-values.yaml
      - name: dcgm-exporter
        url: https://nvidia.github.io/dcgm-exporter/helm-charts
        version: 4.8.4
        namespace: gpu
        valuesFiles:
          - ../platform/gpu/dcgm-exporter-values.yaml

  - name: observability-config
    required: true
    manifests:
      - name: observability
        kustomizations:
          - ../platform/observability

  - name: observability-apps
    required: true
    charts:
      - name: loki
        url: https://grafana.github.io/helm-charts
        version: 7.3.0
        namespace: monitoring
        valuesFiles:
          - ../platform/observability/loki-values.yaml
      - name: alloy
        url: https://grafana.github.io/helm-charts
        version: 1.13.1
        namespace: monitoring
        valuesFiles:
          - ../platform/observability/alloy-values.yaml
      - name: clickhouse-operator-helm
        url: oci://ghcr.io/clickhouse/clickhouse-operator-helm
        version: 0.0.8
        namespace: monitoring
        valuesFiles:
          - ../platform/observability/clickhouse-operator-values.yaml
      - name: langfuse
        url: https://langfuse.github.io/langfuse-k8s
        version: 2.1.5
        namespace: monitoring
        valuesFiles:
          - ../platform/observability/langfuse-values.yaml

  # --- Chapter 10: runtime security and audit -------------------------------
  - name: security
    required: true
    # The audit database's schema ConfigMap must exist before CloudNativePG
    # bootstraps audit-db, so it is created from the migration file first.
    files:
      - source: ../apps/audit/migrations/001_init.sql
        target: audit/001_init.sql
    actions:
      onDeploy:
        before:
          - cmd: >-
              ./zarf tools kubectl -n ai-gateway create configmap audit-db-schema
              --from-file=001_init.sql=audit/001_init.sql --dry-run=client -o yaml
              | ./zarf tools kubectl apply -f -
    manifests:
      # Falco mounts this rules ConfigMap by name, so it goes in first.
      - name: falco-rules
        namespace: falco
        kustomizations:
          - ../platform/security
      - name: audit-sink
        namespace: ai-gateway
        files:
          - ../platform/security/audit-sink.yaml
    charts:
      - name: falco
        url: https://falcosecurity.github.io/charts
        version: 9.2.0
        namespace: falco
        valuesFiles:
          - ../platform/security/falco-values.yaml
    images:
      # Built from apps/audit by the companion repo's CI.
      - ghcr.io/prosperityai/audit-sink:1.0.0

  # Image signature enforcement is deployed LAST and only after every image
  # in Harbor has been signed with the enclave key
  # (platform/security/sign_imported_images.sh). Applied earlier, it rejects
  # the next rollout of anything unsigned.
  - name: image-signature-enforcement
    required: false
    manifests:
      - name: verify-images
        files:
          - ../platform/policies/verify-images.yaml

  # --- Chapter 11: evaluation -----------------------------------------------
  # Image only. The eval Job (platform/evals/eval-job.yaml) starts a run when
  # applied, so it is applied by hand or by upgrade_model.sh, never at deploy.
  - name: evals
    required: false
    images:
      - ghcr.io/prosperityai/sovereign-evals:1.0.0

  # --- Chapter 12: backup and disaster recovery -----------------------------
  # Before deploying: run ops/scripts/barman_plugin_tls.sh once to create the
  # plugin's TLS Secrets (the platform has no cert-manager).
  - name: backup
    required: true
    charts:
      - name: plugin-barman-cloud
        url: https://cloudnative-pg.github.io/charts
        version: 0.8.1
        namespace: cnpg-system
        valuesFiles:
          - ../ops/backup/barman-cloud-values.yaml
      - name: velero
        url: https://vmware-tanzu.github.io/helm-charts
        version: 12.2.1
        namespace: velero
        valuesFiles:
          - ../ops/backup/velero-values.yaml
    manifests:
      - name: backup-schedules
        files:
          - ../ops/backup/cnpg-backup.yaml
          - ../ops/backup/velero-schedule.yaml
      - name: qdrant-snapshots
        namespace: rag
        kustomizations:
          - ../ops/backup/qdrant
    images:
      # Named only in an environment variable of the plugin Deployment, so
      # find-images cannot see it. Keep it here when refreshing the lists.
      - ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar:v0.15.1

  # --- Chapter 12: next cluster upgrade -------------------------------------
  # Images for the offline Talos v1.14.4 / Kubernetes v1.37.1 upgrade. The
  # list is `talosctl images k8s-bundle --k8s-version v1.37.1` (talosctl
  # 1.14.4) plus one installer image per schematic in cluster.env. Regenerate
  # it for every upgrade target; upgrade_cluster.sh refuses to start if any
  # image is missing from Harbor.
  - name: cluster-upgrade
    required: false
    images:
      - ghcr.io/siderolabs/flannel:0.28.9
      - registry.k8s.io/coredns/coredns:v1.14.7
      - registry.k8s.io/etcd:v3.7.2
      - registry.k8s.io/pause:3.10.2
      - registry.k8s.io/kube-apiserver:v1.37.1
      - registry.k8s.io/kube-controller-manager:v1.37.1
      - registry.k8s.io/kube-scheduler:v1.37.1
      - registry.k8s.io/kube-proxy:v1.37.1
      - ghcr.io/siderolabs/kubelet:v1.37.1
      - registry.k8s.io/networking/kube-network-policies:v1.1.2
      - factory.talos.dev/metal-installer/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba:v1.14.4
      - factory.talos.dev/metal-installer/4d457c0bf926994cfed0e1b1e7c9665c3a5edfdb27cba46c7e84be4d212cc577:v1.14.4
